[package]
name = "fedmes-server"
version = "3.0.0"
edition = "2021"
license = "Proprietary"
publish = false
rust-version = "1.85"

[lib]
name = "fedmes_server"
path = "src/lib.rs"

[[bin]]
name = "fedmes-server"
path = "src/bin/fedmes-server.rs"

[[bin]]
name = "fedmes-qr"
path = "src/bin/fedmes-qr.rs"

[[bin]]
name = "fedmes-update-server"
path = "src/bin/fedmes-update-server.rs"

[[bin]]
name = "fedmes-maintainer"
path = "src/bin/fedmes-maintainer.rs"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = 3

[dependencies]
anyhow = "=1.0.93"
axum = { version = "=0.7.9", features = ["http2", "json", "macros"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.38", features = ["serde"] }
clap = { version = "=4.5.21", features = ["derive"] }
hex = "=0.4.3"
hmac = "=0.12.1"
http-body-util = "=0.1.2"
openssl = "=0.10.68"
png = "=0.17.14"
qrcode = { version = "=0.14.1", default-features = false }
rand = "=0.8.5"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
sha2 = "=0.10.8"
subtle = "=2.6.1"
thiserror = "=1.0.69"
tokio = { version = "=1.42.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "=0.1.17", features = ["sync"] }
tokio-util = { version = "=0.7.13", features = ["io"] }
url = "=2.5.4"
uuid = { version = "=1.11.0", features = ["v4", "serde"] }
